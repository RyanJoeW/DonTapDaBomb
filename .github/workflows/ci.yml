name: CI - Backend & Frontend

on:
  push:
  pull_request:

jobs:

  # ===========================
  # BACKEND JOB (Spring Boot)
  # ===========================
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Checkstyle (non-blocking)
        working-directory: ./DonTapDaBomb
        run: mvn checkstyle:check -Dcheckstyle.failOnViolation=false

      - name: Build & Test Backend
        working-directory: ./DonTapDaBomb
        run: mvn clean verify


  # ===========================
  # FRONTEND JOB (React)
  # ===========================
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        working-directory: ./dontapdabomb-web
        run: |
          npm ci
          npm run build
