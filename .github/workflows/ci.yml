name: CI - Build Backend and Frontend

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository (code ophalen)
      uses: actions/checkout@v4

    # === Backend (Spring Boot) ===
    - name: Set up JDK 17 (java instaleren)
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build and test backend (Spring Boot)
      working-directory: ./DonTapDaBomb
      run: |
        ./mvnw clean verify || mvn clean verify

    # === Frontend (React) ===
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install and build frontend (React)
      working-directory: ./dontapdabomb-web
      run: |
        npm ci
        npm run build
