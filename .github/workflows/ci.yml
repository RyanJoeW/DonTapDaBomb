name: CI/CD - Backend, Frontend & Docker

on:
  push:
  pull_request:

jobs:

  # ===========================
  # BACKEND JOB (Spring Boot)
  # ===========================
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Checkstyle (non-blocking)
        working-directory: ./DonTapDaBomb
        run: |
          mvn checkstyle:check -Dcheckstyle.failOnViolation=false || true
          if [ -f "target/checkstyle-result.xml" ]; then
            if grep -q "<error " target/checkstyle-result.xml; then
              echo "::warning::Checkstyle found code style issues"
            fi
          fi

      - name: Build & Test Backend
        working-directory: ./DonTapDaBomb
        run: mvn clean verify


  # ===========================
  # FRONTEND JOB (React)
  # ===========================
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        working-directory: ./dontapdabomb-web
        run: |
          npm ci
          npm run build


  # ===========================
  # DOCKER RELEASE JOB
  # ===========================
  docker-release:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    # wacht op backend & frontend
    needs: [backend, frontend]

    # alleen op main
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Backend image ----
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./DonTapDaBomb
          push: true
          tags: ghcr.io/ryanjoew/dontapdabomb-backend:latest

      # ---- Frontend image ----
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./dontapdabomb-web
          push: true
          tags: ghcr.io/ryanjoew/dontapdabomb-frontend:latest
